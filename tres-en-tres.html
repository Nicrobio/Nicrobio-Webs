<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tres en tres (segunda edición)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap">
<style>
:root{--bg:#F7F3FF;--ink:#3B2A5C;--sub:#6B5A8C;--card:#fff;--line:#E3D9F5;--rosa:#FFC8DA;--lila:#D2C7F8;--menta:#BEEBD3;--sol:#FFF0B8;--plum:#3B2A5C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231A38;--ink:#F4EEFF;--sub:#BDB0DB;--card:#2F2449;--line:#463865}}
:root[data-theme="dark"]{--bg:#231A38;--ink:#F4EEFF;--sub:#BDB0DB;--card:#2F2449;--line:#463865}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
#slats{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95;transition:opacity 1s}
body[data-mode="i"] #slats{opacity:0}
body[data-crt="0"][data-mode="i"] #slats{opacity:.95}
body[data-mode="q"] #slats{opacity:.1}
#crt{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1s}
body[data-mode="q"] #crt{opacity:0}
body{transition:background .8s}
body[data-mode="i"]{--bg:#120F17;--ink:#F4EEFF;--sub:#C9BCE6;--card:#241C33;--line:#463865}
main{position:relative;z-index:1;width:min(560px,calc(100% - 32px));margin:0 auto;padding:24px 0 56px}
h1,h2{font-family:'Young Serif',Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(48px,14vw,76px);line-height:1;letter-spacing:-.02em;text-align:center}
h2{font-size:27px;line-height:1.2;margin:8px 0 20px}
h1:focus,h2:focus{outline:none}
h1 small{display:block;margin-top:10px;font:600 16px Figtree,system-ui,sans-serif;letter-spacing:0;color:var(--sub)}
.in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.intro{text-align:center;background:rgba(18,15,23,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:28px;padding:24px 18px}
.lead{color:var(--sub);font-size:18px;max-width:30ch;margin:12px auto 0}
.venn{position:relative;width:160px;height:140px;margin:0 auto 14px;isolation:isolate}
.venn i{position:absolute;width:88px;height:88px;border-radius:50%;mix-blend-mode:multiply;animation:gather 1.4s cubic-bezier(.2,.9,.25,1) both}
.venn i:nth-child(1){left:6px;top:4px;background:var(--rosa);--x:-50px;--y:-30px}
.venn i:nth-child(2){right:6px;top:4px;background:var(--lila);--x:50px;--y:-30px}
.venn i:nth-child(3){left:36px;top:46px;background:var(--menta);--x:0px;--y:50px}
@keyframes gather{from{transform:translate(var(--x),var(--y));opacity:0}to{transform:none;opacity:1}}
label{display:block;font-weight:600;margin:26px 0 8px}
input{width:100%;max-width:360px;font:inherit;font-size:18px;padding:14px 18px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,.opt:focus-visible,.btn:focus-visible,.back:focus-visible,.sc:focus-visible,.flip:focus-visible,.sl-h:focus-visible,.whd:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.perm{margin:22px 0 10px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:700 16px Figtree,sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--ink)}
.back{background:none;border:0;font:600 15px Figtree,sans-serif;color:var(--sub);cursor:pointer;padding:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-weight:600;font-size:14px}
.pbar{height:6px;border-radius:9px;background:var(--line);margin:4px 0 16px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--lila),var(--menta));transition:width .6s cubic-bezier(.22,1,.36,1)}
.kick{margin:14px 0 0;color:var(--sub);font-weight:600}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.opt:hover,.opt.sel{border-color:var(--ink)}
.opt:hover{transform:translateY(-2px)}
.opt.sel{background:var(--c,var(--card))}
.opt.sel,.opt.sel small{color:var(--plum)}
.opt b{display:block}
.opt small{display:block;color:var(--sub);font-size:14px;line-height:1.4}
.big{font:400 30px 'Young Serif',Georgia,serif}
.mk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--c);color:var(--plum)}

.sig-frame{width:300px;height:150px;margin:0 auto;display:grid;place-items:center}
.sig{position:relative;width:300px;height:150px;border-radius:20px;background:var(--card);border:2px solid var(--line);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;transition:width .6s cubic-bezier(.22,1,.36,1),height .6s cubic-bezier(.22,1,.36,1),border-radius .6s cubic-bezier(.22,1,.36,1)}
.sig.signed{width:112px;height:40px;border-radius:20px;cursor:default}
.sig-face{position:absolute;left:50%;top:50%;width:300px;height:150px;translate:-50% -50%;transition:scale .6s cubic-bezier(.22,1,.36,1),opacity .42s ease .16s}
.sig.signed .sig-face{scale:.35;opacity:0}
.sig-line{position:absolute;left:28px;right:28px;top:106px;height:1px;background:currentColor;opacity:.2}
.sig-hint{position:absolute;left:0;right:0;top:114px;text-align:center;font-size:13px;opacity:.5;transition:opacity .2s;pointer-events:none}
.sig.inked .sig-hint,.sig.settled .sig-hint{opacity:0}
.sig-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;transition:color .26s}
.sig.settled .sig-ink{color:color-mix(in srgb,var(--ink) 30%,var(--card))}
.sig-clear{position:absolute;top:8px;right:8px;height:28px;padding:0 12px;border:0;border-radius:10px;background:color-mix(in srgb,currentColor 8%,transparent);color:inherit;font:600 12px Figtree,sans-serif;cursor:pointer;opacity:0;scale:.9;pointer-events:none;transition:opacity .16s,scale .22s cubic-bezier(.24,1.34,.38,1)}
.sig.inked .sig-clear{opacity:1;scale:1;pointer-events:auto}
.sig.settled .sig-clear{opacity:0}
.sig-said{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sig-pill{width:100%;height:100%;border:0;background:none;color:inherit;font:600 13px Figtree,sans-serif;cursor:pointer;pointer-events:auto;animation:fade .32s ease .42s both}
.sig-pill b{color:#1f9d55;display:inline-block;animation:pop .42s cubic-bezier(.3,1.6,.4,1) .46s both}
@keyframes pop{from{opacity:0;scale:.3;rotate:-20deg}}

.slide{position:relative;width:100%;max-width:320px;height:56px;margin:22px auto 0;border-radius:28px;background:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;transition:opacity .3s}
.slide[data-disabled]{opacity:.4}
.sl-label{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font-weight:600;color:color-mix(in srgb,var(--bg) 65%,transparent);pointer-events:none}
.sl-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:28px;background:var(--menta)}
.sl-h{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:24px;background:var(--bg);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:700;cursor:grab}
.slide[data-disabled] .sl-h{cursor:not-allowed}
.slide.rel .sl-h,.slide.rel .sl-fill{transition:transform .5s cubic-bezier(.34,1.56,.64,1),width .5s cubic-bezier(.34,1.56,.64,1)}
.slide.done .sl-label{color:var(--plum)}

.wake{--c:var(--lila);display:flex;align-items:center;gap:12px}
.wtrack{position:relative;display:flex;flex:1;align-items:center;gap:4px;height:64px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.wb{flex:1;min-width:0;height:56px;border-radius:99px;background:var(--line);transform:scaleY(.214);transition:background .12s}
.wb.on{background:color-mix(in srgb,var(--c) 70%,var(--ink))}
.whd{position:absolute;inset:0;border:0;background:transparent;border-radius:12px;cursor:inherit}
.wval{min-width:3ch;font:400 28px 'Young Serif',Georgia,serif;text-align:right}
.hint{color:var(--sub);font-size:14px;margin:8px 0 22px}

.sc{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:4px 0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:10px}
.bx{position:relative;flex:none;width:28px;height:28px;border-radius:9px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 30%,transparent);overflow:hidden}
.bx::before{content:"";position:absolute;inset:0;background:var(--ink);transform:scale(0);transition:transform .35s cubic-bezier(.34,1.8,.5,1)}
.sc[aria-checked=true] .bx::before{transform:scale(1)}
.bx svg{position:absolute;inset:4px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease .1s}
.sc[aria-checked=true] .bx svg{stroke-dashoffset:0}
.tx{position:relative;transition:opacity .3s}
.tx::after{content:"";position:absolute;left:0;right:0;top:52%;height:2px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s ease .12s}
.sc[aria-checked=true] .tx{opacity:.42}
.sc[aria-checked=true] .tx::after{transform:scaleX(1)}
.list{margin-bottom:22px}

.deck{display:grid;gap:14px}
.flip{cursor:pointer;border-radius:22px}
.flip-in{display:grid}
.face{grid-area:1/1;border-radius:22px;padding:20px;min-height:124px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.face.back{background:var(--c);color:var(--plum)}
.face.front{background:var(--card);border:2px solid var(--line)}
.face p{margin:0}
.em{font:400 26px/1 'Young Serif',Georgia,serif}
.btn.sm{padding:9px 18px;font-size:14px;align-self:flex-start;background:var(--plum);color:#fff;border-color:var(--plum)}

.cat-stage{position:relative;height:310px;margin-bottom:6px}
.cat{position:absolute;left:50%;top:0;width:96px;margin-left:-48px;touch-action:none;cursor:grab;z-index:2;transition:transform .55s cubic-bezier(.3,1.4,.4,1)}
.cat.drag{cursor:grabbing;transition:none}
.cat svg{display:block;width:96px;height:108px;overflow:visible;pointer-events:none}
.cname{display:block;text-align:center;font:400 15px 'Young Serif',Georgia,serif;pointer-events:none}
.cat-tail{transform-origin:72px 100px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(10deg)}}
.cat-eyes{transform-origin:50px 48px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.zones{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:136px;padding:8px;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:20px;background:var(--c);color:var(--plum);font:inherit;font-size:13px;line-height:1.25;text-align:center;cursor:pointer;transition:transform .25s,border-color .2s}
.zone.on{border-style:solid;border-color:var(--plum);transform:translateY(-3px)}
.zone .em{font-size:32px}

.tms{width:100%;max-width:300px;margin:0 auto 6px;padding:20px 20px 16px;border-radius:20px;background:var(--card);border:2px solid var(--line);user-select:none;-webkit-user-select:none}
.tms-read{display:flex;align-items:baseline;justify-content:center;gap:8px}
.tms-time{display:inline-flex;font-size:34px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tms-col{display:inline-block;width:.62em;height:1.5em;margin:-.25em 0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);transition:width .3s,opacity .3s}
.tms-col.hide{width:0;opacity:0}
.tms-strip{display:flex;flex-direction:column;transition:transform .22s cubic-bezier(.24,1.34,.38,1)}
.tms-strip>span{height:1.5em;line-height:1.5em}
.tms-mer{font-size:14px;font-weight:600;color:var(--sub)}
.tms-ruler{position:relative;height:58px;margin-top:16px;cursor:grab;touch-action:pan-y;outline:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.tms-ruler:active{cursor:grabbing}
.tms-track{position:absolute;left:50%;top:0;bottom:0}
.tms-tick{position:absolute;left:-1px;top:8px;width:2px;height:10px;border-radius:1px;background:var(--ink);transform-origin:50% 0}
.tms-tick[data-k="quarter"]{height:17px}
.tms-tick[data-k="hour"]{height:25px}
.tms-hour{position:absolute;left:0;top:38px;font-size:11px;white-space:nowrap;color:var(--sub)}
.tms-mark{position:absolute;left:50%;top:2px;width:3px;height:32px;margin-left:-1.5px;border-radius:2px;background:#ff6f9f}

.cass{position:relative;width:min(100%,320px);aspect-ratio:1.6;margin:0 auto 14px;padding:12px;border-radius:16px;background:var(--rosa);color:var(--plum);box-shadow:0 0 0 2px var(--plum);display:grid;grid-template-rows:auto 1fr;gap:8px}
.cass-lab{background:#fff;border-radius:8px;padding:6px 10px;border:2px solid var(--plum)}
.cass-lab b{display:block;font:400 15px/1.2 'Young Serif',Georgia,serif}
.cass-lab small{font-size:12px}
.cass-win{background:var(--plum);border-radius:999px;display:flex;justify-content:space-around;align-items:center;padding:6px 18px}
.reel{position:relative;width:46px;height:46px;border-radius:50%;background:conic-gradient(#fff 0 12%,var(--lila) 0 25%,#fff 0 37%,var(--lila) 0 50%,#fff 0 62%,var(--lila) 0 75%,#fff 0 87%,var(--lila) 0);animation:spin 1.6s linear infinite;animation-play-state:paused}
.reel::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--plum)}
.cass.on .reel{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.tapes{display:grid;gap:8px;margin-bottom:12px}
.tape{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;text-align:left;border:2px solid var(--line);border-left:12px solid var(--lila);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:transform .2s,border-color .2s}
.tape.sel{border-color:var(--ink);border-left-color:var(--rosa);transform:translateX(4px)}
.tape b{font-size:15px}
.tape small{color:var(--sub);font-size:13px}
.mact{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.mact[hidden]{display:none}
.btn.sm2{padding:10px 16px;font-size:14px}

.c3d{position:relative;width:100%;max-width:420px;aspect-ratio:1.25;margin:0 auto 10px;border-radius:20px;overflow:hidden;background:var(--bg);display:grid;place-items:center;color:var(--sub);font-size:14px}
.c3d[hidden],.cass[hidden]{display:none}
.c3d canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}70%{transform:translateY(1px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(190,235,211,.75)}100%{box-shadow:0 0 0 16px rgba(190,235,211,0)}}
.opts>*,.tapes>*,.zones>*,.deck>*,.list>*{animation:rise .5s cubic-bezier(.34,1.56,.64,1) backwards}
h2{animation:rise .45s cubic-bezier(.34,1.56,.64,1) backwards}
.btn[data-next]:not(:disabled){animation:floaty 3s ease-in-out 1s infinite}
.opt.sel{animation:pop .4s}
.opt:hover .mk{animation:hop .6s}
.back{transition:transform .2s}
.back:hover{transform:translateX(-4px)}
.bx{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sc:hover .bx{transform:scale(1.12) rotate(-6deg)}
.sc[aria-checked=true] .bx{animation:pop .4s}
.zone:hover{border-color:var(--plum);box-shadow:0 8px 18px rgba(59,42,92,.16)}
.zone:hover .em,.flip:hover .em{animation:hop .6s}
.zone.on .em{animation:hop .6s}
.flip:not(.on):hover .face.front{border-color:var(--ink);box-shadow:0 8px 18px rgba(59,42,92,.16)}
.tape:hover{transform:translateX(4px)}
.tape.sel{animation:pop .4s}
.cat:hover svg{animation:floaty 1s ease-in-out infinite}
.venn{animation:floaty 4s ease-in-out infinite}
.slide:not([data-disabled]):not(.done) .sl-h{animation:ring 1.6s infinite}
.tapes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.face{transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s linear .4s}
.face.front{transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s linear .4s,border-color .2s,box-shadow .2s}
.face.back{opacity:0;transform:scale(.97);visibility:hidden}
.flip.on .face.front{opacity:0;transform:scale(.97);visibility:hidden;pointer-events:none}
.flip.on .face.back{opacity:1;transform:none;visibility:visible;transition:opacity .4s ease .05s,transform .4s cubic-bezier(.22,1,.36,1) .05s,visibility 0s}

.flip.big .face{border-radius:32px}
.flip.big .front{align-items:center;text-align:center;min-height:360px;gap:10px}
.flip.big .front small{color:var(--sub)}
.res{padding:28px 24px;cursor:default}
.res .kick{color:var(--plum);margin:0}
.res h2{margin:4px 0 4px;font-size:34px}
.letter{display:inline-grid;place-items:center;width:44px;height:44px;margin-left:10px;border-radius:50%;background:#ffffffaa;font-size:24px;vertical-align:middle}
.sub{margin:0;font-weight:600}
.why{margin:14px 0 0;font-size:15px}
.aff{display:grid;gap:6px;margin:16px 0 0;font-size:13px;font-weight:600}
.aff div{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center}
.aff u{display:block;height:8px;border-radius:9px;background:#ffffff88;text-decoration:none;overflow:hidden}
.aff i{display:block;height:100%;width:var(--w);border-radius:9px;background:var(--plum)}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:20px 0}
.res dt{font-weight:700}
.res dd{margin:0}
.dress{display:inline-block;background:var(--sol);padding:10px 16px;border-radius:14px;font-weight:700;transform:rotate(-1.5deg);margin:0 0 20px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.res .btn{background:var(--plum);color:#fff;border-color:var(--plum)}
.res .btn.alt{background:transparent;color:var(--plum)}
@media(max-width:420px){.res dl{grid-template-columns:1fr;gap:2px}.res dd{margin-bottom:10px}.aff div{grid-template-columns:84px 1fr 38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<button type="button" class="btn alt" data-reset>Repetir el test</button></div></div></div></div>`;}

  depthMat.depthTest = false; depthMat.depthWrite = false;
  const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader); hBlur.depthTest = false;
  const vBlur = new THREE.ShaderMaterial(VerticalBlurShader); vBlur.depthTest = false;
  function blurShadow(amount) {
    blurPlane.visible = true;
    blurPlane.material = hBlur; hBlur.uniforms.tDiffuse.value = rtShadow.texture; hBlur.uniforms.h.value = amount / 256;
    renderer.setRenderTarget(rtBlur); renderer.render(blurPlane, shadowCam);
    blurPlane.material = vBlur; vBlur.uniforms.tDiffuse.value = rtBlur.texture; vBlur.uniforms.v.value = amount / 256;
    renderer.setRenderTarget(rtShadow); renderer.render(blurPlane, shadowCam);
    blurPlane.visible = false;
  }
  function renderShadow() {
    const b = scene.background; scene.background = null;
    shadowPlane.visible = false;
    scene.overrideMaterial = depthMat;
    const ca = renderer.getClearAlpha(); renderer.setClearAlpha(0);
    renderer.setRenderTarget(rtShadow); renderer.render(scene, shadowCam);
    scene.overrideMaterial = null;
    blurShadow(3.2); blurShadow(3.2 * 0.4);
    renderer.setRenderTarget(null); renderer.setClearAlpha(ca);
    scene.background = b; shadowPlane.visible = true;
  }

  function layout() {
    const w = host.clientWidth || 320, h = host.clientHeight || 256, aspect = w / h;
    camera.aspect = aspect;
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = Math.max(4.25 / (2 * tanH), 5.3 / (2 * tanH * aspect));
    camera.position.set(0, d * 0.085, d);
    camera.lookAt(0, -0.2, 0);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    renderer.setSize(w, h, false);
    U.uKeyV.value.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse);
  }
  layout();
  const ro = new ResizeObserver(layout); ro.observe(host);

  (function calibrate() {
    try {
      const ts = new THREE.Scene(); ts.environment = scene.environment; ts.environmentIntensity = 1.0;
      const kl = new THREE.DirectionalLight(0xffffff, key.intensity); kl.position.copy(key.position); ts.add(kl);
      ts.add(new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0 })));
      const oc = new THREE.PerspectiveCamera(10, 1, 0.1, 50); oc.position.copy(camera.position); oc.lookAt(0, 0, 0);
      const rt = new THREE.WebGLRenderTarget(8, 8, { type: THREE.FloatType });
      renderer.setRenderTarget(rt); renderer.render(ts, oc);
      const buf = new Float32Array(8 * 8 * 4); renderer.readRenderTargetPixels(rt, 0, 0, 8, 8, buf);
      renderer.setRenderTarget(null); rt.dispose();
      let s = 0, n = 0;
      for (let i = 0; i < 64; i++) { const L = 0.2126 * buf[i * 4] + 0.7152 * buf[i * 4 + 1] + 0.0722 * buf[i * 4 + 2]; if (isFinite(L) && L > 0) { s += L; n++; } }
      if (n) { const k = THREE.MathUtils.clamp(0.93 / (s / n), 0.35, 3.0); scene.environmentIntensity = k; key.intensity *= k; rim.intensity *= k; }
    } catch (e) { renderer.setRenderTarget(null); }
  })();


  const AUTO = 0.3;
  let yaw = 0.42, yawVel = AUTO, pitchOff = 0, dragging = false, lx = 0, ly = 0, lt = 0;
  canvas.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; lt = performance.now(); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const now = performance.now(), dx = e.clientX - lx, dy = e.clientY - ly, dts = Math.max(8, now - lt) / 1000;
    yaw += dx * 0.0085;
    yawVel = THREE.MathUtils.clamp(THREE.MathUtils.lerp(yawVel, dx * 0.0085 / dts, 0.5), -9, 9);
    pitchOff = THREE.MathUtils.clamp(pitchOff + dy * 0.0065, -1.25, 1.25);
    lx = e.clientX; ly = e.clientY; lt = now;
  });
  const endDrag = () => { dragging = false; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

  const W_L = Math.PI * 2 * 0.75, W_R = W_L * HUB_L.pack / HUB_R.pack, TAU = Math.PI * 2;
  let angL = 0, angR = 0, spin = 0.18, goal = 0.18, alive = true, raf = 0, frame = 0;
  const clock = new THREE.Clock();
  renderer.compile(scene, camera);
  function tick() {
    if (!alive) return;
    raf = requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
    if (!dragging) {
      yawVel += (AUTO - yawVel) * (1 - Math.exp(-dt * 1.1));
      yaw += yawVel * dt;
      pitchOff *= Math.exp(-dt * 0.9);
    }
    spin += (goal - spin) * (1 - Math.exp(-dt * 3));
    cassette.rotation.set(0.27 * Math.sin(t * 0.85) + pitchOff, yaw, 0.05 * Math.sin(t * 0.53 + 1.0), 'YXZ');
    cassette.position.y = 0.04 * Math.sin(t * 0.9 + 0.6);
    angL = (angL - W_L * spin * dt) % TAU; angR = (angR - W_R * spin * dt) % TAU;
    reelL.rotation.z = angL; reelR.rotation.z = angR;
    U.uAng.value.set(angL, angR);
    U.uTime.value = t;
    if ((frame++ & 1) === 0) renderShadow();
    renderer.render(scene, camera);
  }
  tick();

  return {
    setSong(s, i) { drawArt(cvA, s, i); applyColors(i); texA.needsUpdate = true; yawVel = 9; },
    playing(b) { goal = b ? 1 : 0.18; },
    destroy() { alive = false; cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); renderer.forceContextLoss(); canvas.remove(); }
  };
}
